name: Tests Django

# Lancé à chaque push sur main
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest # Machine temporaire gratuite de github

    steps:
      # Recupere le code depuis repo
      - uses: actions/checkout@v4

      # Installe Python (même version que locale)
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Installe les dependances de requirements.txt
      - name: Installer les dependances
        run: pip install -r requirements.txt

      # Lance les tests Django
      - name: Lancer les tests
        run: python manage.py test